
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-notice-board
spec:
  replicas: 2
  selector:
    matchLabels:
      app: college-notice-board
  template:
    metadata:
      labels:
        app: college-notice-board
    spec:
      containers:
        - name: notice-board
          image: aarxn06/college-notice-board:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: college-notice-service
spec:
  type: NodePort
  selector:
    app: college-notice-board
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081
